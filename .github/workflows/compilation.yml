name: Compilation Leyla EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Recuperer le code
      uses: actions/checkout@v4

    - name: Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installation de PyInstaller et des dependances
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller streamlit uvicorn fastapi pydantic pillow google-genai pygetwindow sounddevice scipy numpy opencv-python-headless
        if (Test-Path -Path "requirements.txt") { pip install -r requirements.txt }

    - name: Preparation du dossier .streamlit et ressources
      run: |
        if (!(Test-Path -Path ".streamlit")) { New-Item -ItemType Directory -Path ".streamlit" }
        if (!(Test-Path -Path ".streamlit\config.toml")) { Set-Content -Path ".streamlit\config.toml" -Value "[theme]`nprimaryColor='#F63366'" }
        if (Test-Path -Path "secrets.toml") { Copy-Item -Path "secrets.toml" -Destination ".streamlit\secrets.toml" -Force }

    - name: Compilation avec PyInstaller et le fichier spec
      run: |
        pyinstaller --noconfirm leyla.spec

    - name: Verification et preparation du dossier pour l'artefact
      run: |
        $source = "dist/Leyla_Edge_Agent"
        if (Test-Path $source) {
            Write-Host "Build trouvé avec succès dans $source"
        } else {
            Write-Error "Le dossier de build est introuvable !"
            exit 1
        }

    - name: Telecharger le fichier EXE
      uses: actions/upload-artifact@v4
      with:
        name: Leyla-Executable-Windows
        path: dist/Leyla_Edge_Agent/
