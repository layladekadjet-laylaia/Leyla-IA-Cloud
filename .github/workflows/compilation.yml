name: Compilation Leyla EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Configuration de Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compilation avec PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --add-data ".streamlit;./.streamlit" run_app.py --name Leyla

    - name: Telecharger le fichier EXE
      uses: actions/upload-artifact@v3
      with:
        name: Leyla-Executable-Windows
        path: dist/Leyla/
        
