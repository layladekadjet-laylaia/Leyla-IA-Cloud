name: Compilation Leyla EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Recuperer le code
      uses: actions/checkout@v4

    - name: Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installation de PyInstaller et des dependances
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyarmor streamlit uvicorn fastapi pydantic pillow google-genai pygetwindow sounddevice scipy numpy
        if (Test-Path -Path "requirements.txt") { pip install -r requirements.txt }

    - name: Preparation du dossier .streamlit et secrets
      run: |
        if (!(Test-Path -Path ".streamlit")) { New-Item -ItemType Directory -Path ".streamlit" }
        if (!(Test-Path -Path ".streamlit\config.toml")) { Set-Content -Path ".streamlit\config.toml" -Value "[theme]`nprimaryColor='#F63366'" }
        if (Test-Path -Path "secrets.toml") { Copy-Item -Path "secrets.toml" -Destination ".streamlit\secrets.toml" -Force }

    - name: Compilation directe avec PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --name Leyla_Edge_Agent --collect-all streamlit --collect-all uvicorn --collect-all PIL --collect-all google.genai --collect-all sounddevice --collect-all scipy --collect-all bleak --add-data "config.toml;." --add-data "LOGO LAYLA.png;." run_app.py

    - name: Copie de tous les modules Python et ressources dans le dossier final
      run: |
        Copy-Item -Path "*.py" -Destination "dist/Leyla_Edge_Agent/" -Force
        if (Test-Path -Path "config.toml") { Copy-Item -Path "config.toml" -Destination "dist/Leyla_Edge_Agent/" -Force }
        if (Test-Path -Path "LOGO LAYLA.png") { Copy-Item -Path "LOGO LAYLA.png" -Destination "dist/Leyla_Edge_Agent/" -Force }
        if (Test-Path -Path "utils_db") { Copy-Item -Path "utils_db" -Destination "dist/Leyla_Edge_Agent/" -Recurse -Force }
        if (Test-Path -Path "dist/Leyla_Edge_Agent/_internal") {
            Copy-Item -Path "*.py" -Destination "dist/Leyla_Edge_Agent/_internal/" -Force
            if (Test-Path -Path "utils_db") { Copy-Item -Path "utils_db" -Destination "dist/Leyla_Edge_Agent/_internal/" -Recurse -Force }
        }

    - name: Telecharger le fichier EXE
      uses: actions/upload-artifact@v4
      with:
        name: Leyla-Executable-Windows
        path: dist/Leyla_Edge_Agent/
