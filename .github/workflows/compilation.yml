name: Compilation Leyla EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Recuperer le code
      uses: actions/checkout@v4

    - name: Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installation de PyInstaller et des dependances
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyarmor streamlit uvicorn fastapi pydantic pillow google-genai pygetwindow sounddevice scipy numpy opencv-python-headless
        if (Test-Path -Path "requirements.txt") { pip install -r requirements.txt }

    - name: Preparation du dossier .streamlit et ressources
      run: |
        if (!(Test-Path -Path ".streamlit")) { New-Item -ItemType Directory -Path ".streamlit" }
        if (!(Test-Path -Path ".streamlit\config.toml")) { Set-Content -Path ".streamlit\config.toml" -Value "[theme]`nprimaryColor='#F63366'" }
        if (Test-Path -Path "secrets.toml") { Copy-Item -Path "secrets.toml" -Destination ".streamlit\secrets.toml" -Force }

    - name: Copie et Obfuscation complète avec PyArmor
      run: |
        New-Item -ItemType Directory -Path "pyarmor_out" -Force
        Copy-Item -Path "*.py" -Destination "pyarmor_out/" -Force
        if (Test-Path -Path "config.toml") { Copy-Item -Path "config.toml" -Destination "pyarmor_out/" -Force }
        if (Test-Path -Path "requirements.txt") { Copy-Item -Path "requirements.txt" -Destination "pyarmor_out/" -Force }
        if (Test-Path -Path "LOGO LAYLA.png") { Copy-Item -Path "LOGO LAYLA.png" -Destination "pyarmor_out/" -Force }
        if (Test-Path -Path "leyla.spec") { Copy-Item -Path "leyla.spec" -Destination "pyarmor_out/" -Force }

        cd pyarmor_out
        pyarmor gen --recursive .

    - name: Compilation avec PyInstaller
      run: |
        cd pyarmor_out
        pyinstaller --noconfirm leyla.spec

    - name: Deplacement automatique du resultat vers l'artefact
      run: |
        $found = Get-ChildItem -Path "pyarmor_out" -Recurse -Filter "Leyla_Edge_Agent" -Directory | Select-Object -First 1
        $dest = "dist/Leyla_Edge_Agent"
        if ($found) {
            New-Item -ItemType Directory -Path $dest -Force
            Copy-Item -Path "$($found.FullName)\*" -Destination $dest -Recurse -Force
            Write-Host "Dossier trouvé et déplacé avec succès vers $dest"
        } else {
            Write-Error "Impossible de localiser le dossier Leyla_Edge_Agent généré !"
            exit 1
        }

    - name: Telecharger le fichier EXE
      uses: actions/upload-artifact@v4
      with:
        name: Leyla-Executable-Windows
        path: dist/Leyla_Edge_Agent/
