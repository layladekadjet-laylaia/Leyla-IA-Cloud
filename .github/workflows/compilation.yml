name: Compilation Leyla EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Recuperer le code
      uses: actions/checkout@v4

    - name: Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installation de PyInstaller et des dependances
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyarmor streamlit uvicorn fastapi pydantic pillow google-genai pygetwindow sounddevice scipy numpy opencv-python-headless
        if (Test-Path -Path "requirements.txt") { pip install -r requirements.txt }

    - name: Preparation du dossier .streamlit et ressources
      run: |
        if (!(Test-Path -Path ".streamlit")) { New-Item -ItemType Directory -Path ".streamlit" }
        if (!(Test-Path -Path ".streamlit\config.toml")) { Set-Content -Path ".streamlit\config.toml" -Value "[theme]`nprimaryColor='#F63366'" }
        if (Test-Path -Path "secrets.toml") { Copy-Item -Path "secrets.toml" -Destination ".streamlit\secrets.toml" -Force }

    - name: Obfuscation du code avec PyArmor
      run: |
        # Commande compatible PyArmor 8+ pour chiffrer tous les fichiers .py
        pyarmor gen --recursive --output dist_obf *.py

    - name: Compilation avec PyInstaller via le fichier spec
      run: |
        # On copie le fichier spec dans le dossier obfusqué si nécessaire, ou on compile directement
        pyinstaller Leyla_Edge_Agent.spec

    - name: Telecharger le fichier EXE
      uses: actions/upload-artifact@v4
      with:
        name: Leyla-Executable-Windows
        path: dist/
