name: Compilation Leyla EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Recuperer le code
      uses: actions/checkout@v4

    - name: Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installation de PyInstaller et des dependances
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller streamlit uvicorn fastapi pydantic pillow
        pip install -r requirements.txt

    - name: Preparation du dossier .streamlit et secrets
      run: |
        if (!(Test-Path -Path ".streamlit")) { New-Item -ItemType Directory -Path ".streamlit" }
        if (!(Test-Path -Path ".streamlit\config.toml")) { Set-Content -Path ".streamlit\config.toml" -Value "[theme]`nprimaryColor='#F63366'" }
        if (Test-Path -Path "secrets.toml") { Copy-Item -Path "secrets.toml" -Destination ".streamlit\secrets.toml" -Force }

    - name: Compilation avec PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --collect-all streamlit --collect-all uvicorn --collect-all PIL --collect-all pillow --hidden-import=PIL --hidden-import=PIL.Image --hidden-import=PIL.ImageDraw --hidden-import=PIL.ImageFont --add-data ".streamlit;.streamlit" --add-data "*.py;." run_app.py --name Leyla

    - name: Copie explicite des fichiers source et ressources
      run: |
        Copy-Item -Path "*.py" -Destination "dist/Leyla/" -Force
        if (Test-Path -Path "LOGO LAYLA.png") { Copy-Item -Path "LOGO LAYLA.png" -Destination "dist/Leyla/" -Force }
        if (Test-Path -Path "dist/Leyla/_internal") {
            Copy-Item -Path "*.py" -Destination "dist/Leyla/_internal/" -Force
            if (Test-Path -Path "LOGO LAYLA.png") { Copy-Item -Path "LOGO LAYLA.png" -Destination "dist/Leyla/_internal/" -Force }
        }

    - name: Telecharger le fichier EXE
      uses: actions/upload-artifact@v4
      with:
        name: Leyla-Executable-Windows
        path: dist/Leyla/
