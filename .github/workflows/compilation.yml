name: Compilation Leyla EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Recuperer le code
      uses: actions/checkout@v4

    - name: Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installation des dependances et de PyArmor
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyarmor streamlit uvicorn fastapi pydantic pillow google-genai pygetwindow sounddevice scipy numpy
        if (Test-Path -Path "requirements.txt") { pip install -r requirements.txt }

    - name: Chiffrement des modules avec PyArmor
      shell: powershell
      run: |
        pyarmor gen moteur_ia.py recherche_ia.py utils_actions.py utils_audit.py hub_leyla.py
        if ($LASTEXITCODE -ne 0) { Write-Host "Avertissement PyArmor ignoré, poursuite de la compilation." }

    - name: Preparation du dossier .streamlit et secrets
      run: |
        if (!(Test-Path -Path ".streamlit")) { New-Item -ItemType Directory -Path ".streamlit" }
        if (!(Test-Path -Path ".streamlit\config.toml")) { Set-Content -Path ".streamlit\config.toml" -Value "[theme]`nprimaryColor='#F63366'" }
        if (Test-Path -Path "secrets.toml") { Copy-Item -Path "secrets.toml" -Destination ".streamlit\secrets.toml" -Force }

    - name: Compilation PyInstaller avec leyla.spec
      run: |
        pyinstaller leyla.spec

    - name: Copie des ressources et fichiers de configuration
      run: |
        if (Test-Path -Path "LOGO LAYLA.png") { Copy-Item -Path "LOGO LAYLA.png" -Destination "dist/Leyla_Edge_Agent/" -Force }
        if (Test-Path -Path "config.toml") { Copy-Item -Path "config.toml" -Destination "dist/Leyla_Edge_Agent/" -Force }
        if (Test-Path -Path "dist/Leyla_Edge_Agent/_internal") {
            if (Test-Path -Path "LOGO LAYLA.png") { Copy-Item -Path "LOGO LAYLA.png" -Destination "dist/Leyla_Edge_Agent/_internal/" -Force }
            if (Test-Path -Path "config.toml") { Copy-Item -Path "config.toml" -Destination "dist/Leyla_Edge_Agent/_internal/" -Force }
        }

    - name: Telecharger l'executable genere
      uses: actions/upload-artifact@v4
      with:
        name: Leyla-Executable-Windows
        path: dist/Leyla_Edge_Agent/
